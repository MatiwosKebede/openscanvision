name: Bug Report
description: Report a bug in OpenScanVision.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: Tell us what you see.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps did you take to encounter this issue?
      placeholder: |
        1. Open the sample app.
        2. Hold a card in front of the camera.
        3. The app crashes.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android Version
      description: Which device and Android version are you using?
      placeholder: Pixel 6, Android 14
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat Output
      description: Paste any relevant logcat output.
      render: shell
